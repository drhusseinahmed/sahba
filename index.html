<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سَحبة — لعبة الورق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0d2b2a; --bg2:#071615; --felt:#12403c;
  --gold:#f4c95d; --gold2:#e09f3e; --cream:#fbf3e0; --ink:#1c1a17;
  --ice:#8fdcff; --red:#ff5d5d; --ok:#5fe3a1;
  --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --disp:"Lalezar","Segoe UI",Tahoma,sans-serif;
  --body:"Cairo","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body);color:#eef5f2;
  background:
    radial-gradient(1200px 700px at 50% -10%, #1c5a53 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
    linear-gradient(var(--bg1),var(--bg2));
  background-attachment:fixed; overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.hidden{display:none!important}

/* ---------- بطاقات ---------- */
.card{
  --c:#333; width:var(--w,84px); aspect-ratio:5/7; border-radius:calc(var(--w,84px)*.13);
  background:linear-gradient(160deg,#fffaf0,#f1e4c4); color:var(--c);
  position:relative; flex:none; display:grid; place-items:center;
  box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35);
  font-family:var(--disp); user-select:none;
}
.card::before{content:"";position:absolute;inset:6%;border-radius:inherit;border:calc(var(--w,84px)*.03) solid var(--c);opacity:.85}
.card .big{font-size:calc(var(--w,84px)*.62);line-height:1;position:relative;top:.04em}
.card .big.u{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.08em}
.card .cn{position:absolute;font-size:calc(var(--w,84px)*.2);line-height:1}
.card .cn.tl{top:11%;right:13%} .card .cn.br{bottom:11%;left:13%;transform:rotate(180deg)}
.card .cap{position:absolute;bottom:13%;font-family:var(--body);font-weight:800;font-size:calc(var(--w,84px)*.13);white-space:nowrap}
.card.act{color:#fff}
.card.act::before{border-color:rgba(255,255,255,.75)}
.card.act .big{font-size:calc(var(--w,84px)*.48);top:-.12em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card.x2{background:linear-gradient(160deg,#ffd66b,#e08a1e)}
.card.p4,.card.p8{background:linear-gradient(160deg,#58d68d,#16885a)}
.card.fr{background:linear-gradient(160deg,#9fe6ff,#2b7fd1)}
.card.d3{background:linear-gradient(160deg,#c79bff,#6a35c9)}
.card.ch{background:linear-gradient(160deg,#ff9ab8,#d42a63)}
.card.back{
  background:
    radial-gradient(circle at 50% 50%, var(--gold) 0 16%, transparent 17%),
    repeating-linear-gradient(45deg,#7a1f3d 0 6px,#8f2748 6px 12px);
  color:#7a1f3d;
}
.card.back::before{border-color:var(--gold)}
.card.back::after{content:"س";font-size:calc(var(--w,84px)*.3);position:relative;top:.02em}
.card.dead{filter:grayscale(1) brightness(.75)}
.card.boom{outline:3px solid var(--red);outline-offset:-3px;filter:none}
.card.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}

/* ---------- شاشة الإعداد ---------- */
#setup{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.logo{font-family:var(--disp);text-align:center;line-height:1}
.logo h1{font-size:clamp(64px,17vw,110px);color:var(--gold);text-shadow:0 4px 0 #8a4b12,0 12px 30px rgba(0,0,0,.5);font-weight:400}
.logo p{font-family:var(--body);opacity:.8;margin-top:4px}
.fan{display:flex;justify-content:center;margin:18px 0 26px;--w:64px;direction:ltr}
.fan .card{margin:0 -10px;transform:rotate(calc((var(--i) - 2)*9deg)) translateY(calc((var(--i) - 2)*(var(--i) - 2)*5px));animation:deal .6s calc(var(--i)*.08s) backwards cubic-bezier(.2,1.2,.3,1)}
@keyframes deal{from{transform:translateY(-140px) rotate(40deg);opacity:0}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(4px)}
.box h2{font-family:var(--disp);font-weight:400;font-size:24px;color:var(--gold);margin-bottom:10px}
.prow{display:flex;gap:8px;margin-bottom:8px;align-items:center;animation:rowin .25s}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}}
.prow .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
input{font-family:inherit;font-size:17px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;width:100%;outline:none}
input:focus{border-color:var(--gold)}
.icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);font-size:18px;flex:none;transition:.15s}
.icon:hover{background:rgba(255,255,255,.18)}
.ghost{background:rgba(255,255,255,.08);border:1px dashed var(--line);border-radius:12px;padding:10px;width:100%;font-weight:600}
.ghost:hover{background:rgba(255,255,255,.14)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:600}
.chip.on{background:var(--gold);color:var(--ink)}
.btn{
  font-family:var(--disp);font-size:22px;padding:12px 26px;border-radius:16px;
  background:linear-gradient(#ffd97a,var(--gold2));color:#3b2203;
  box-shadow:0 5px 0 #8a4b12,0 10px 20px rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a4b12}
.btn.ice{background:linear-gradient(#b6ecff,#4aa3e6);color:#06304f;box-shadow:0 5px 0 #1d5c94,0 10px 20px rgba(0,0,0,.35)}
.btn.ice:active{box-shadow:0 1px 0 #1d5c94}
.btn:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed;transform:none}
.btn.wide{width:100%;margin-top:18px;font-size:28px}
.link{background:none;text-decoration:underline;opacity:.8;margin-top:14px;display:block;width:100%;text-align:center;font-size:15px}

/* ---------- شاشة اللعب ---------- */
#game{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#hud{flex:none;padding:8px 14px;z-index:5}
#stage{position:relative;flex:1;min-height:0}
#felt{position:absolute;border-radius:50%;
  background:radial-gradient(ellipse at 50% 38%,#23877a 0%,#125248 62%,#0c3a34 100%);
  border:14px solid #6b3f1d;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 0 70px rgba(0,0,0,.55),0 0 0 4px #2e1908,0 24px 60px rgba(0,0,0,.55)}
#felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,255,255,.09)}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px}
.mid{display:flex;align-items:center;gap:18px}
.piles{display:flex;gap:12px;direction:ltr;--w:clamp(50px,9vh,74px)}
#pile{width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.13);border:2px dashed rgba(255,255,255,.28);display:grid;place-items:center}
#pile .card{transform:rotate(7deg)}
.bar{display:flex;align-items:center;gap:10px;max-width:1200px;margin:0 auto}
.bar .brand{font-family:var(--disp);font-size:28px;color:var(--gold)}
.pill{background:rgba(255,255,255,.08);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill b{color:var(--gold)}
.sp{flex:1}
#deck{position:relative}
#deck .card{box-shadow:2px 2px 0 #5d1830,4px 4px 0 #4b1226,6px 6px 0 #3a0e1e,0 14px 20px rgba(0,0,0,.45)}
#deckN{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);font-weight:800;font-size:13px;border-radius:99px;padding:0 9px;border:1px solid var(--gold)}
.turn{text-align:center;min-width:130px}
.turn small{opacity:.7;font-size:13px}
.turn .who{font-family:var(--disp);font-size:30px;line-height:1.15;color:#fff}
.turn .risk{font-size:14px;font-weight:600}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

#players{position:absolute;inset:0}
.panel{position:absolute;width:var(--sw);background:rgba(9,30,28,.9);border:2px solid var(--line);border-radius:16px;padding:10px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:border-color .25s, box-shadow .25s, opacity .25s}
.panel.current{border-color:var(--gold);box-shadow:0 0 0 4px rgba(244,201,93,.25),0 0 40px rgba(244,201,93,.45);transform:scale(1.06);z-index:3}
.panel.current::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:glow 1.6s infinite;box-shadow:inset 0 0 26px rgba(244,201,93,.25)}
@keyframes glow{50%{opacity:.25}}
.p-head{display:flex;align-items:center;gap:8px}
.p-name{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap}
.p-total{margin-inline-start:auto;font-family:var(--disp);font-size:24px;color:var(--gold);line-height:1}
.prog{height:4px;border-radius:9px;background:rgba(255,255,255,.1);margin:4px 0 7px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:9px;transition:width .6s}
.p-cards{--w:var(--cw);display:flex;flex-wrap:nowrap;min-height:calc(var(--cw)*1.4 + 4px);align-items:center}
.p-cards .cn.tl{font-size:calc(var(--w)*.3);top:8%;right:10%}
.p-cards .cn.br{display:none}
.p-cards .empty{opacity:.4;font-size:13px}
.p-cards .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.p-foot{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;opacity:.9}
.p-foot b{font-size:15px;color:var(--ok)}
.dots{display:flex;gap:3px;align-items:center;direction:ltr}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.dots i.on{background:var(--gold)}
.panel.frozen{border-color:var(--ice);background:linear-gradient(160deg,#1d4a5c,#0f2c38)}
.panel.frozen::before{content:"❄";position:absolute;left:-8px;bottom:-34px;font-size:120px;opacity:.12;pointer-events:none;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel.frozen .badge{background:var(--ice);color:#06304f}
.panel.frozen.justnow{animation:freeze .7s}
@keyframes freeze{0%{filter:brightness(2.2) saturate(0)}100%{filter:none}}
.panel.bust{border-color:rgba(255,93,93,.6);background:rgba(30,14,16,.92)}
.panel.bust .badge{background:var(--red);color:#fff}
.panel.bust .p-foot b{color:var(--red)}
.panel.bust.justnow{animation:shake .5s}
@keyframes shake{20%{transform:translateX(9px) rotate(1deg)}40%{transform:translateX(-9px) rotate(-1deg)}60%{transform:translateX(6px)}80%{transform:translateX(-6px)}}
.panel.seven{border-color:var(--gold);box-shadow:0 0 34px rgba(244,201,93,.5)}
.panel.seven .badge{background:var(--gold);color:var(--ink)}

/* ---------- البطاقة الطائرة ---------- */
.fly{position:fixed;z-index:30;perspective:900px;pointer-events:none}
.fly-in{position:relative;transform-style:preserve-3d;width:var(--w);aspect-ratio:5/7}
.fly-in .card{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fly-in .ff{transform:rotateY(180deg)}
.fly.bad .ff{box-shadow:0 0 0 4px var(--red),0 0 40px var(--red)}
.fly.good .ff{box-shadow:0 0 0 3px var(--gold),0 0 40px var(--gold)}

/* ---------- رسائل ونوافذ ---------- */
#flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
#flash div{font-family:var(--disp);font-size:clamp(34px,8vw,70px);padding:6px 30px;border-radius:20px;text-align:center;margin-top:36vh;
  text-shadow:0 4px 0 rgba(0,0,0,.4);animation:flash 1.5s forwards}
#flash .bad{color:var(--red)} #flash .ice{color:var(--ice)} #flash .gold{color:var(--gold)} #flash .vio{color:#d3b3ff}
@keyframes flash{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.12);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#overlay{position:fixed;inset:0;background:rgba(3,10,10,.72);backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modal{background:linear-gradient(#17413d,#0e2826);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(520px,100%);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:up .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(30px) scale(.95);opacity:0}}
#modal h2{font-family:var(--disp);font-weight:400;font-size:30px;color:var(--gold);text-align:center;line-height:1.2}
#modal .sub{text-align:center;opacity:.85;margin:4px 0 14px}
.targets{display:grid;gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid transparent;font-size:18px;font-weight:800;text-align:start;transition:.12s}
.tbtn:hover{border-color:var(--gold);background:rgba(255,255,255,.15);transform:translateX(-4px)}
.tbtn span{margin-inline-start:auto;font-weight:600;font-size:14px;opacity:.8}
.tbtn em{font-style:normal;font-size:13px;font-weight:600;background:var(--gold);color:var(--ink);border-radius:99px;padding:0 8px}
table{width:100%;border-collapse:collapse;margin:12px 0}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:17px}
tr{animation:rowin .4s backwards}
td.n{font-weight:800} td.r{text-align:center;font-weight:800;color:var(--ok)} td.r.z{color:var(--red)}
td.t{text-align:end;font-family:var(--disp);font-size:24px;color:var(--gold)}
tr.lead td.n::after{content:" 👑"}
.rules{font-size:15.5px;line-height:1.9}
.rules li{margin-inline-start:20px;margin-bottom:4px}
.rules b{color:var(--gold)}
.crown{font-size:80px;text-align:center;animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.btn.sm{font-size:19px;padding:9px 18px;border-radius:14px}
/* شاشات ضيقة: الطاولة فوق واللاعبون تحتها */
.stack #stage{overflow:auto}
.stack #felt{display:none}
.stack #center{position:relative;left:auto;top:auto;transform:none;margin:8px 10px;padding:14px 8px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 38%,#23877a,#0c3a34);border:8px solid #6b3f1d;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.stack #players{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 10px 40px}
.stack .panel{position:relative;width:auto;left:auto!important;top:auto!important}
@media (max-width:560px){
  .bar .brand{font-size:22px} .pill{font-size:12px;padding:3px 8px}
  .turn .who{font-size:24px} .turn{min-width:100px} .mid{gap:10px}
  .btn.sm{font-size:16px;padding:8px 12px}
}

/* ---------- الغرف ---------- */
.page{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.row{display:flex;gap:8px;align-items:center}
.row input{direction:ltr;font-size:14px;min-width:0}
.btn.mini{font-size:17px;padding:9px 14px;border-radius:12px;box-shadow:0 3px 0 #8a4b12;white-space:nowrap;flex:none}
.btn.mini:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4b12}
#codeIn{text-transform:uppercase;letter-spacing:8px;text-align:center;font-family:var(--disp);font-size:24px}
.codebox{display:flex;justify-content:center;gap:8px;direction:ltr;margin:4px 0 14px}
.codebox span{width:50px;height:62px;border-radius:12px;background:linear-gradient(160deg,#fffaf0,#f1e4c4);color:var(--ink);font-family:var(--disp);font-size:38px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.seat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:6px;font-weight:800;font-size:17px;min-height:48px}
.seat.empty{opacity:.4;font-weight:400;font-size:15px;border:1px dashed var(--line);background:none;justify-content:center}
.seat .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;background:var(--gold);color:var(--ink);white-space:nowrap}
.tag.you{background:var(--ok)}
.err{color:var(--red);text-align:center;min-height:24px;margin-top:10px;font-weight:600}
.note{text-align:center;opacity:.8;margin-top:14px}
.bigval{font-family:var(--disp);font-size:30px;color:var(--gold);text-align:center}
.panel.me .p-name::after{content:" (أنت)";font-weight:400;font-size:12px;opacity:.7}
.panel.me{border-color:rgba(95,227,161,.55)}
.panel.me.current{border-color:var(--gold)}
.turn.mine .who{color:var(--gold)}
.turn.mine small{color:var(--gold);opacity:1;font-weight:800;animation:glow 1.2s infinite}
#skipBtn{cursor:pointer;border:1px solid var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- ===== الرئيسية ===== -->
<section id="home" class="page">
  <div class="logo"><h1>سَحبة</h1><p>اسحب… بس لا تتكرر!</p></div>
  <div class="fan" id="fan"></div>
  <div class="box">
    <h2 id="homeTitle">اسمك</h2>
    <p class="note hidden" id="inviteNote" style="margin:0 0 10px"></p>
    <input id="nameIn" maxlength="14" placeholder="اكتب اسمك" autocomplete="off">
    <button class="btn wide hidden" id="joinBtn">انضم للغرفة</button>
    <button class="btn wide" id="createBtn">إنشاء غرفة جديدة</button>
  </div>
  <div class="box" id="codeBox" style="margin-top:14px">
    <h2>عندك رمز دعوة؟</h2>
    <div class="row"><input id="codeIn" maxlength="5" placeholder="ABCDE" autocomplete="off"><button class="btn mini" id="codeBtn">دخول</button></div>
  </div>
  <p class="err" id="homeErr"></p>
  <button class="link hidden" id="otherBtn">أو أنشئ غرفة جديدة</button>
  <button class="link" id="rulesBtn0">كيف ألعب؟</button>
</section>

<!-- ===== غرفة الانتظار ===== -->
<section id="lobby" class="page hidden">
  <div class="logo"><h1 style="font-size:60px">سَحبة</h1><p>غرفة الانتظار</p></div>
  <div class="box" style="margin-top:16px">
    <h2>رمز الدعوة</h2>
    <div class="codebox" id="codeShow"></div>
    <div class="row"><input id="linkIn" readonly><button class="btn mini" id="copyBtn">نسخ الرابط</button></div>
    <button class="ghost hidden" id="shareBtn" style="margin-top:8px">📤 مشاركة الرابط</button>
  </div>
  <div class="box" style="margin-top:14px">
    <h2>اللاعبون <span id="pcount" style="font-size:16px;opacity:.7"></span></h2>
    <div id="seats"></div>
  </div>
  <div class="box" style="margin-top:14px">
    <h2>نقاط الفوز</h2>
    <div id="targetEdit">
      <input id="target" type="number" min="20" max="9999" step="10" value="200" inputmode="numeric">
      <div class="chips" id="chips"></div>
    </div>
    <p id="targetShow" class="bigval hidden"></p>
  </div>
  <button class="btn wide" id="startBtn">ابدأ اللعب</button>
  <p class="note" id="waitNote"></p>
  <button class="link" id="leaveBtn">مغادرة الغرفة</button>
</section>

<!-- ===== اللعب ===== -->
<section id="game" class="hidden">
  <header id="hud">
    <div class="bar">
      <span class="brand">سَحبة</span>
      <span class="pill">الجولة <b id="roundN">1</b></span>
      <span class="pill">الهدف <b id="targetN">200</b></span>
      <span class="pill">الغرفة <b id="codeN" style="direction:ltr;display:inline-block"></b></span>
      <span class="sp"></span>

    let f = null; try { f = await Net.get(CODE); } catch (e) { flash('تعذّر الاتصال', 'bad'); }
    if (f) onState(f);
  }

}

/* ====== استقبال الحالات وعرضها بالترتيب ====== */
function onState(s) {
  if (!s || !s.v || s.v <= lastV || !CODE) return;
  lastV = s.v; queue.push(s); pump();
}
async function pump() {
  if (pumping) return;
  pumping = true;
  try {
    while (queue.length) {
      const s = queue.shift();
      try { await present(s, queue.length < 3); } catch (e) { console.error(e); S = s; }
      if (!CODE) break;
    }
  } finally { pumping = false; }
  idle();
}
function idle() {
  if (!S || !CODE || pumping) return;
  setButtons();
  const top = topOf(S);
  if (S.phase === 'play' && top && top.k === 'auto' && top.t === ME && autoV !== S.v) {
    autoV = S.v;
    setTimeout(() => act(A.auto).then(ok => { if (!ok) { autoV = 0; setTimeout(idle, 900); } }), 350);
  }
}
function show(id) {
  ['home', 'lobby', 'game'].forEach(k => $('#' + k).classList.toggle('hidden', k !== id));
}
async function present(s, animate) {
  const prev = S;
  const step = animate && prev && s.v === prev.v + 1 && Array.isArray(s.ev);
  ME = s.players.findIndex(p => p.id === PID);
  if (s.phase === 'lobby') {
    if (ME < 0) { leaveLocal('تمت إزالتك من الغرفة'); return; }
    S = s; if (modalKind === 'result' || modalKind === 'pick') hideModal();
    show('lobby'); renderLobby();
    return;
  }
  const evs = step ? s.ev : [];
  const wasMine = prev ? actor(prev) === ME : false;
  const d = evs.find(e => e.e === 'draw');
  if (d && prev.phase === 'play' && !document.hidden && !$('#game').classList.contains('hidden')) {
    if (modalKind === 'pick') hideModal();
    await flyCard(d.c, d.p, d.res === 'bust', d.res === 'num' || d.res === 'mod' || d.res === 'bust', d.n);
  }
  S = s; show('game');
  if (s.phase === 'play' && modalKind === 'result') hideModal();
  render(d && d.res === 'bust' ? d.p : undefined, d);
  const name = i => s.players[i].name;
  for (const e of evs) {
    if (e.e === 'draw') {
      if (e.res === 'bust') { flash(`💥 ${name(e.p)} خسر الجولة!`, 'bad'); await sleep(1100); }
      else if (e.res === 'saved') { sfx.chance(); flash(`🍀 الفرصة أنقذت ${name(e.p)}!`, 'gold'); await sleep(1200); }
    }
    else if (e.e === 'seven') { sfx.seven(); flash('⭐ سبع بطاقات! +15', 'gold'); await sleep(1300); }
    else if (e.e === 'freeze') { sfx.freeze(); render(e.p); flash(`❄ ${name(e.p)} تجمّد على ${e.score}`, 'ice'); await sleep(1000); }
    else if (e.e === 'nofreeze') { flash('❄ لا يوجد خصم لتجميده', 'ice'); await sleep(900); }
    else if (e.e === 'd3') { flash(`🃏 ${name(e.p)} يسحب ثلاث!`, 'vio'); await sleep(900); }
    else if (e.e === 'shuffle') flash('🔀 خلط الأوراق', 'gold');
    else if (e.e === 'round') { sfx.shuffle(); flash(`الجولة ${e.n}`, 'gold'); await sleep(600); }
    else if (e.e === 'roundEnd') await sleep(600);
  }
  if (step && !wasMine && actor(s) === ME && !queue.length) { sfx.click(); try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} }
  syncModal();
}
function syncModal() {
  const top = topOf(S);
  if (S.phase === 'roundEnd' || S.phase === 'gameEnd') {
    if (!(modalKind === 'result' && modalV === S.v)) { showResult(); modalKind = 'result'; modalV = S.v; }
  } else if (S.phase === 'play' && top && top.k === 'pick' && top.by === ME) {
    if (!(modalKind === 'pick' && modalV === S.v)) { showPick(top); modalKind = 'pick'; modalV = S.v; }
  } else if (modalKind === 'result' || modalKind === 'pick') hideModal();
}

function metrics() {

}

}

// ينتظر انتهاء الحركة، مع مهلة احتياطية إذا كان التبويب في الخلفية
const done = (an, ms) => Promise.race([an.finished, sleep(ms + 250)]);
async function flyCard(c, pi, bust, keep, n) {
  const d = $('#deck .card').getBoundingClientRect();
  const fly = el('div', 'fly'); fly.style.left = d.left + 'px'; fly.style.top = d.top + 'px'; fly.style.setProperty('--w', d.width + 'px');
  const inner = el('div', 'fly-in'); const face = cardEl(c); face.classList.add('ff');
  inner.append(cardEl(null), face); fly.append(inner); document.body.append(fly);
  const cx = innerWidth / 2 - (d.left + d.width / 2);
  const cy = innerHeight / 2 - (d.top + d.height / 2);
  const S2 = Math.min(2.1, innerWidth / d.width / 2.6);
  const mid = `translate(${cx}px,${cy}px) scale(${S2})`;
  const o = { duration: 460, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' };
  sfx.draw();
  inner.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }], o);
  await done(fly.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: mid }], o), 460);
  if (bust) {
    fly.classList.add('bad'); sfx.bust();
    await done(fly.animate([0, 14, -14, 10, -10, 5, 0].map(x => ({ transform: `translate(${cx + x}px,${cy}px) scale(${S2})` })), { duration: 520 }), 520);
    await sleep(250);
  } else {
    if (c.t !== 'n') { fly.classList.add('good'); ({ fr: sfx.freeze, d3: sfx.d3, ch: sfx.chance }[c.t] || sfx.mod)(); } else sfx.ok(n || 0);
    await sleep(c.t === 'n' ? 360 : 700);
  }
  const pn = keep ? panelOf(pi) : null;
  if (pn) {
    pn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const t = pn.querySelector('.p-cards').getBoundingClientRect();
    const tx = t.left + t.width / 2 - (d.left + d.width / 2), ty = t.top + t.height / 2 - (d.top + d.height / 2);
    await done(fly.animate([{ transform: mid }, { transform: `translate(${tx}px,${ty}px) scale(.5)`, opacity: .6 }], { duration: 320, easing: 'ease-in', fill: 'forwards' }), 320);
  } else {
    const t = $('#pile').getBoundingClientRect();
    await done(fly.animate([{ transform: mid }, { transform: `translate(${t.left - d.left}px,${t.top - d.top}px) scale(1) rotate(7deg)` }], { duration: 300, easing: 'ease-in', fill: 'forwards' }), 300);
  }
  fly.remove();
}

function genCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 5; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }
function enter(code, s) {

let entering = false;

  entering = true; homeErr('');
  try {
    Net.cleanup();
    for (let k = 0; k < 5; k++) {
      const code = genCode();
      const s = { v: 1, phase: 'lobby', host: PID, target: 200, players: [newPlayer(name)], round: 0, starter: -1, cur: 0, deck: [], discard: [], last: null, q: [], over: false, ev: [] };
      if (await Net.create(code, s)) { enter(code, s); return; }

  } catch (e) { homeErr('تعذّر الاتصال بالخادم'); }
  finally { entering = false; }
}
async function joinRoom(raw) {

  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { homeErr('رمز الدعوة من 5 خانات'); return; }
  const name = getName(); if (!name) return;
  entering = true; homeErr('');
  try {

      const s = await Net.get(code);
      if (!s) { homeErr('الغرفة غير موجودة — تأكد من الرمز'); return; }
      if (s.players.some(p => p.id === PID) || s.phase !== 'lobby') { enter(code, s); return; }
      if (s.players.length >= MAXP) { homeErr('الغرفة ممتلئة'); return; }
      const n = clone(s); n.players.push(newPlayer(name)); n.v = s.v + 1; n.ev = [];
      if (await Net.update(code, n, s.v)) { enter(code, n); return; }
    }
    homeErr('الغرفة مزدحمة الآن، حاول مرة ثانية');
  } catch (e) { homeErr('تعذّر الاتصال بالخادم'); }
  finally { entering = false; }
}
function leaveLocal(msg) {
  Net.unsubscribe();
  CODE = null; S = null; queue = []; ME = -1; INVITE = null;
  hideModal();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  homeMode(); show('home'); homeErr(msg || '');
}
async function leaveRoom() {
  if (S && S.phase === 'lobby' && ME >= 0) await act(A.kick(PID));
  if (CODE) leaveLocal();
}
function homeMode() {
  const inv = !!INVITE;
  $('#homeTitle').textContent = inv ? 'دعوة للعب' : 'اسمك';
  $('#inviteNote').classList.toggle('hidden', !inv);
  $('#inviteNote').textContent = inv ? `أنت مدعو إلى الغرفة ${INVITE} — اختر اسمك وادخل` : '';
  $('#joinBtn').classList.toggle('hidden', !inv);
  $('#createBtn').classList.toggle('hidden', inv);
  $('#codeBox').classList.toggle('hidden', inv);
  $('#otherBtn').classList.toggle('hidden', !inv);
}

/* ================= التشغيل ================= */
function init() {
  const fan = $('#fan');
  [{ t: 'n', v: 7 }, { t: 'x2' }, { t: 'n', v: 12 }, { t: 'fr' }, { t: 'n', v: 3 }].forEach((c, i) => { const e = cardEl(c); e.style.setProperty('--i', i); fan.append(e); });
  $('#nameIn').value = store('sahba_name') || '';
  const chips = $('#chips');
  [100, 150, 200, 300].forEach(v => { const c = el('button', 'chip', v); c.onclick = () => act(A.target(v)); chips.append(c); });
  $('#target').onchange = () => { const v = Math.max(20, Math.min(9999, parseInt($('#target').value, 10) || 200)); $('#target').value = v; act(A.target(v)); };
  $('#createBtn').onclick = createRoom;
  $('#joinBtn').onclick = () => joinRoom(INVITE);
  $('#codeBtn').onclick = () => joinRoom($('#codeIn').value);
  $('#codeIn').onkeydown = e => { if (e.key === 'Enter') joinRoom($('#codeIn').value); };
  $('#nameIn').onkeydown = e => { if (e.key === 'Enter') (INVITE ? joinRoom(INVITE) : createRoom()); };
  $('#otherBtn').onclick = () => { INVITE = null; try { history.replaceState(null, '', location.pathname); } catch (e) {} homeMode(); homeErr(''); };
  $('#rulesBtn0').onclick = showRules; $('#rulesBtn').onclick = showRules;
  $('#startBtn').onclick = () => act(A.start);
  $('#leaveBtn').onclick = leaveRoom;
  $('#copyBtn').onclick = async () => {
    const b = $('#copyBtn'), link = inviteLink();
    try { await navigator.clipboard.writeText(link); } catch (e) { const i = $('#linkIn'); i.select(); try { document.execCommand('copy'); } catch (e2) {} }
    b.textContent = 'تم النسخ ✓'; setTimeout(() => { b.textContent = 'نسخ الرابط'; }, 1600);
  };
  if (navigator.share) {
    $('#shareBtn').classList.remove('hidden');
    $('#shareBtn').onclick = () => navigator.share({ title: 'سَحبة', text: `تعال العب معي سَحبة! رمز الغرفة: ${CODE}`, url: inviteLink() }).catch(() => {});
  }
  $('#drawBtn').onclick = () => act(A.draw);
  $('#stayBtn').onclick = () => act(A.stay);
  $('#skipBtn').onclick = () => act(A.skip);
  $('#muteBtn').onclick = () => { muted = !muted; if (!muted) sfx.click(); $('#muteBtn').textContent = muted ? '🔇' : '🔊'; };
  $('#exitBtn').onclick = () => {
    const m = $('#modal'); m.replaceChildren();
    m.append(el('h2', '', 'الخروج من الغرفة؟'), el('p', 'sub', 'مقعدك يبقى محفوظاً، وتقدر ترجع من نفس الرابط'));
    const b1 = el('button', 'btn wide', 'نعم، خروج'); b1.onclick = () => leaveLocal();
    const b2 = el('button', 'link', 'رجوع للعب'); b2.onclick = () => { hideModal(); if (S) { modalV = 0; syncModal(); } };
    m.append(b1, b2); openModal('user');
  };
  addEventListener('resize', () => { if (S && S.phase !== 'lobby' && !$('#game').classList.contains('hidden')) render(); });

  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (room.length === 5) {
    INVITE = room; homeMode();
    // إذا كنت عضواً في هذه الغرفة من قبل ترجع إليها مباشرة
    Net.get(room).then(s => {
      if (CODE) return;
      if (!s) { INVITE = null; homeMode(); homeErr('الغرفة غير موجودة أو انتهت'); }
      else if (s.players.some(p => p.id === PID)) enter(room, s);
    }, () => homeErr('تعذّر الاتصال بالخادم'));
  } else homeMode();
}
init();
</script>
